<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
  <title id="title">ClubSpark Azure AKS reference architecture</title>
  <desc id="desc">A private multi-zone AKS architecture with API Management, Kubernetes workloads, KEDA workers, Service Bus, Functions, PostgreSQL, Redis and Azure operations services.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f9ff"/><stop offset="1" stop-color="#eef4fb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#183b61" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#5c7085"/></marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#102a43}.subtitle{font:400 15px Arial,sans-serif;fill:#52667a}.zone-title{font:700 17px Arial,sans-serif;fill:#17324d}.box-title{font:700 14px Arial,sans-serif;fill:#102a43}.box-copy{font:400 11.5px Arial,sans-serif;fill:#40566b}.small{font:600 11px Arial,sans-serif;fill:#52667a}.zone{fill:#fff;stroke:#c7d8e8;stroke-width:1.5;rx:16}.subzone{fill:#f8fbff;stroke:#a9c5df;stroke-width:1.2;stroke-dasharray:5 4;rx:12}.box{fill:#fff;stroke-width:1.5;rx:11;filter:url(#shadow)}.edge-box{stroke:#1676d2}.aks-box{stroke:#326ce5}.app-box{stroke:#1f8a70}.fn-box{stroke:#7656b5}.msg-box{stroke:#e18700}.data-box{stroke:#0078d4}.line{fill:none;stroke:#5c7085;stroke-width:2;marker-end:url(#arrow)}.event{fill:none;stroke:#d47b00;stroke-width:2.3;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1160" fill="url(#bg)"/>
  <text x="70" y="54" class="title">ClubSpark Azure AKS Reference Architecture</text>
  <text x="70" y="80" class="subtitle">Private multi-zone Kubernetes platform with managed Azure messaging, data, security and serverless integration services</text>

  <rect x="70" y="110" width="1460" height="74" class="zone"/>
  <text x="92" y="138" class="zone-title">Clients</text>
  <rect x="270" y="126" width="280" height="42" class="box edge-box"/><text x="410" y="152" text-anchor="middle" class="box-title">Admin and internal portals</text>
  <rect x="660" y="126" width="280" height="42" class="box edge-box"/><text x="800" y="152" text-anchor="middle" class="box-title">Customer portal</text>
  <rect x="1050" y="126" width="280" height="42" class="box edge-box"/><text x="1190" y="152" text-anchor="middle" class="box-title">Mobile app and partners</text>

  <rect x="70" y="210" width="1460" height="112" class="zone"/>
  <text x="92" y="238" class="zone-title">Edge and API access</text>
  <rect x="170" y="254" width="340" height="50" class="box edge-box"/><text x="340" y="275" text-anchor="middle" class="box-title">Azure Front Door</text><text x="340" y="292" text-anchor="middle" class="box-copy">CDN, WAF, TLS and global routing</text>
  <rect x="630" y="254" width="340" height="50" class="box edge-box"/><text x="800" y="275" text-anchor="middle" class="box-title">Azure Static Web Apps</text><text x="800" y="292" text-anchor="middle" class="box-copy">Next.js portal delivery</text>
  <rect x="1090" y="254" width="340" height="50" class="box edge-box"/><text x="1260" y="275" text-anchor="middle" class="box-title">Azure API Management</text><text x="1260" y="292" text-anchor="middle" class="box-copy">Auth, policies, limits and API versions</text>

  <rect x="70" y="350" width="1070" height="424" class="zone"/>
  <text x="92" y="378" class="zone-title">Private Azure Kubernetes Service cluster - Standard tier, three availability zones</text>
  <rect x="105" y="400" width="1000" height="50" class="box aks-box"/><text x="605" y="421" text-anchor="middle" class="box-title">Application Gateway for Containers or managed NGINX ingress</text><text x="605" y="438" text-anchor="middle" class="box-copy">Private ingress, internal routing, health checks and controlled rollout traffic</text>

  <rect x="105" y="472" width="270" height="136" class="subzone"/>
  <text x="125" y="496" class="box-title">System node pool</text><text x="125" y="514" class="box-copy">Zone-spanning, minimum 3 nodes</text>
  <rect x="125" y="530" width="230" height="58" class="box aks-box"/><text x="240" y="553" text-anchor="middle" class="box-title">Cluster platform</text><text x="240" y="572" text-anchor="middle" class="box-copy">CoreDNS, policy, Defender, agents</text>

  <rect x="400" y="472" width="705" height="214" class="subzone"/>
  <text x="420" y="496" class="box-title">User node pools</text><text x="420" y="514" class="box-copy">Topology spread across three zones, HPA and cluster autoscaler</text>
  <rect x="425" y="530" width="205" height="62" class="box app-box"/><text x="527" y="553" text-anchor="middle" class="box-title">Commerce APIs</text><text x="527" y="573" text-anchor="middle" class="box-copy">Booking, order, payment</text>
  <rect x="650" y="530" width="205" height="62" class="box app-box"/><text x="752" y="553" text-anchor="middle" class="box-title">Customer APIs</text><text x="752" y="573" text-anchor="middle" class="box-copy">People, membership, entitlement</text>
  <rect x="875" y="530" width="205" height="62" class="box app-box"/><text x="977" y="553" text-anchor="middle" class="box-title">Sport APIs</text><text x="977" y="573" text-anchor="middle" class="box-copy">Venue, coaching, teams, competitions</text>
  <rect x="425" y="610" width="205" height="55" class="box app-box"/><text x="527" y="633" text-anchor="middle" class="box-title">Platform APIs</text><text x="527" y="652" text-anchor="middle" class="box-copy">Admin and templates</text>
  <rect x="650" y="610" width="205" height="55" class="box msg-box"/><text x="752" y="633" text-anchor="middle" class="box-title">KEDA workers</text><text x="752" y="652" text-anchor="middle" class="box-copy">Service Bus consumers</text>
  <rect x="875" y="610" width="205" height="55" class="box aks-box"/><text x="977" y="633" text-anchor="middle" class="box-title">CronJobs</text><text x="977" y="652" text-anchor="middle" class="box-copy">Analytics and batch</text>

  <rect x="260" y="706" width="720" height="48" class="box msg-box"/><text x="620" y="726" text-anchor="middle" class="box-title">Transactional outbox dispatcher</text><text x="620" y="743" text-anchor="middle" class="box-copy">Publishes committed domain events reliably to Azure Service Bus</text>

  <rect x="1170" y="350" width="360" height="424" class="zone"/>
  <text x="1192" y="378" class="zone-title">Managed serverless workflows</text>
  <rect x="1205" y="420" width="290" height="92" class="box fn-box"/><text x="1350" y="447" text-anchor="middle" class="box-title">Azure Functions</text><text x="1350" y="467" text-anchor="middle" class="box-copy">External webhooks and lightweight</text><text x="1350" y="485" text-anchor="middle" class="box-copy">event-driven integrations</text>
  <rect x="1205" y="540" width="290" height="92" class="box fn-box"/><text x="1350" y="567" text-anchor="middle" class="box-title">Durable Functions</text><text x="1350" y="587" text-anchor="middle" class="box-copy">Renewals, refunds and</text><text x="1350" y="605" text-anchor="middle" class="box-copy">long-running workflows</text>
  <rect x="1205" y="660" width="290" height="70" class="box edge-box"/><text x="1350" y="685" text-anchor="middle" class="box-title">External providers</text><text x="1350" y="705" text-anchor="middle" class="box-copy">Payments, messaging and accounting</text>

  <rect x="70" y="806" width="1460" height="108" class="zone"/>
  <text x="92" y="834" class="zone-title">Asynchronous backbone</text>
  <rect x="270" y="850" width="1060" height="48" class="box msg-box"/><text x="800" y="870" text-anchor="middle" class="box-title">Azure Service Bus</text><text x="800" y="887" text-anchor="middle" class="box-copy">Domain event topics, command queues, scheduled messages, retries, duplicate detection and dead-letter queues</text>

  <rect x="70" y="946" width="1460" height="128" class="zone"/>
  <text x="92" y="974" class="zone-title">Managed data services</text>
  <rect x="130" y="990" width="500" height="66" class="box data-box"/><text x="380" y="1014" text-anchor="middle" class="box-title">Azure Database for PostgreSQL Flexible Server</text><text x="380" y="1034" text-anchor="middle" class="box-copy">Private endpoint, zone HA, PgBouncer, read replica and tenant RLS</text>
  <rect x="690" y="990" width="300" height="66" class="box data-box"/><text x="840" y="1014" text-anchor="middle" class="box-title">Azure Managed Redis</text><text x="840" y="1034" text-anchor="middle" class="box-copy">Availability, rules and entitlements</text>
  <rect x="1050" y="990" width="300" height="66" class="box data-box"/><text x="1200" y="1014" text-anchor="middle" class="box-title">Azure Blob Storage</text><text x="1200" y="1034" text-anchor="middle" class="box-copy">Media, exports and payloads</text>

  <rect x="70" y="1100" width="1460" height="42" class="zone"/>
  <text x="92" y="1127" class="zone-title">Cross-cutting:</text><text x="245" y="1127" class="box-copy">Workload Identity + RBAC</text><text x="440" y="1127" class="box-copy">Key Vault CSI</text><text x="560" y="1127" class="box-copy">Azure Monitor + Prometheus + Grafana + Application Insights</text><text x="1020" y="1127" class="box-copy">ACR</text><text x="1090" y="1127" class="box-copy">CI/CD + Flux GitOps</text>

  <path d="M410 168 V210" class="line"/><path d="M800 168 V210" class="line"/><path d="M1190 168 V210" class="line"/>
  <path d="M510 279 H630" class="line"/><path d="M970 279 H1090" class="line"/><path d="M1260 304 V335 H605 V400" class="line"/>
  <path d="M605 450 V515 H527 V530" class="line"/><path d="M605 450 V515 H752 V530" class="line"/><path d="M605 450 V515 H977 V530" class="line"/>
  <path d="M527 665 V690 H620 V706" class="event"/><path d="M752 592 V706" class="event"/><path d="M977 592 V690 H620 V706" class="event"/>
  <path d="M620 754 V850" class="event"/><path d="M800 850 V760 H752 V665" class="event"/>
  <path d="M1330 874 H1150 V466 H1205" class="event"/><path d="M1330 874 H1160 V586 H1205" class="event"/>
  <path d="M380 990 V930 H527 V665" class="line"/><path d="M840 990 V930 H752 V592" class="line"/><path d="M1200 990 V930 H1350 V512" class="line"/>
  <path d="M1495 466 H1540 V695 H1495" class="line"/>
</svg>
