<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">ClubSpark Azure reference architecture</title>
  <desc id="desc">Hybrid serverless Azure deployment using Front Door, API Management, Container Apps, Functions, Service Bus, PostgreSQL, Redis, Key Vault and Azure Monitor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#183b61" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5c7085"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #102a43; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #52667a; }
      .zone-title { font: 700 17px Arial, sans-serif; fill: #17324d; }
      .box-title { font: 700 15px Arial, sans-serif; fill: #102a43; }
      .box-copy { font: 400 12px Arial, sans-serif; fill: #40566b; }
      .small { font: 600 11px Arial, sans-serif; fill: #52667a; }
      .zone { fill: #ffffff; stroke: #c7d8e8; stroke-width: 1.5; rx: 16; }
      .box { fill: #ffffff; stroke-width: 1.5; rx: 12; filter: url(#shadow); }
      .edge-box { stroke: #1676d2; }
      .app-box { stroke: #1f8a70; }
      .fn-box { stroke: #7656b5; }
      .msg-box { stroke: #e18700; }
      .data-box { stroke: #0078d4; }
      .ops-box { stroke: #60768a; }
      .line { fill: none; stroke: #5c7085; stroke-width: 2; marker-end: url(#arrow); }
      .event { fill: none; stroke: #d47b00; stroke-width: 2.3; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .support { fill: none; stroke: #7b8c9b; stroke-width: 1.6; stroke-dasharray: 4 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="url(#bg)"/>
  <text x="70" y="54" class="title">ClubSpark Azure Reference Architecture</text>
  <text x="70" y="80" class="subtitle">Hybrid serverless deployment: stable domain APIs in Container Apps, elastic event processing in Functions and Jobs</text>

  <!-- Clients -->
  <rect x="70" y="115" width="1460" height="84" class="zone"/>
  <text x="92" y="143" class="zone-title">Clients</text>
  <rect x="270" y="132" width="260" height="50" class="box edge-box"/>
  <text x="400" y="154" text-anchor="middle" class="box-title">Admin and internal portals</text>
  <text x="400" y="171" text-anchor="middle" class="box-copy">Club administrators and ClubSpark staff</text>
  <rect x="670" y="132" width="260" height="50" class="box edge-box"/>
  <text x="800" y="154" text-anchor="middle" class="box-title">Customer portal</text>
  <text x="800" y="171" text-anchor="middle" class="box-copy">Multi-tenant web experience</text>
  <rect x="1070" y="132" width="260" height="50" class="box edge-box"/>
  <text x="1200" y="154" text-anchor="middle" class="box-title">Mobile app and partners</text>
  <text x="1200" y="171" text-anchor="middle" class="box-copy">Expo app and external API consumers</text>

  <!-- Edge -->
  <rect x="70" y="225" width="1460" height="126" class="zone"/>
  <text x="92" y="253" class="zone-title">Edge and API access</text>
  <rect x="180" y="271" width="350" height="60" class="box edge-box"/>
  <text x="355" y="296" text-anchor="middle" class="box-title">Azure Front Door</text>
  <text x="355" y="315" text-anchor="middle" class="box-copy">CDN, WAF, TLS and global routing</text>
  <rect x="625" y="271" width="350" height="60" class="box edge-box"/>
  <text x="800" y="296" text-anchor="middle" class="box-title">Azure Static Web Apps</text>
  <text x="800" y="315" text-anchor="middle" class="box-copy">Next.js portal delivery</text>
  <rect x="1070" y="271" width="350" height="60" class="box edge-box"/>
  <text x="1245" y="296" text-anchor="middle" class="box-title">Azure API Management</text>
  <text x="1245" y="315" text-anchor="middle" class="box-copy">Auth, rate limits, policies and versioning</text>

  <!-- Compute -->
  <rect x="70" y="385" width="920" height="270" class="zone"/>
  <text x="92" y="413" class="zone-title">Private Azure Container Apps environment</text>
  <rect x="105" y="438" width="260" height="88" class="box app-box"/>
  <text x="235" y="463" text-anchor="middle" class="box-title">Commerce APIs</text>
  <text x="235" y="483" text-anchor="middle" class="box-copy">Booking, order and payment</text>
  <text x="235" y="501" text-anchor="middle" class="box-copy">Consistency-sensitive transactions</text>
  <rect x="400" y="438" width="260" height="88" class="box app-box"/>
  <text x="530" y="463" text-anchor="middle" class="box-title">Customer APIs</text>
  <text x="530" y="483" text-anchor="middle" class="box-copy">People, membership and entitlement</text>
  <text x="530" y="501" text-anchor="middle" class="box-copy">Tenant-aware domain services</text>
  <rect x="695" y="438" width="260" height="88" class="box app-box"/>
  <text x="825" y="463" text-anchor="middle" class="box-title">Sport APIs</text>
  <text x="825" y="483" text-anchor="middle" class="box-copy">Venue, coaching, teams, competitions</text>
  <text x="825" y="501" text-anchor="middle" class="box-copy">Admin and template services</text>
  <rect x="252" y="555" width="555" height="66" class="box msg-box"/>
  <text x="530" y="581" text-anchor="middle" class="box-title">Transactional Outbox</text>
  <text x="530" y="601" text-anchor="middle" class="box-copy">Domain changes and events commit atomically before publication</text>

  <rect x="1020" y="385" width="510" height="270" class="zone"/>
  <text x="1042" y="413" class="zone-title">Serverless processing</text>
  <rect x="1055" y="438" width="440" height="70" class="box fn-box"/>
  <text x="1275" y="463" text-anchor="middle" class="box-title">Azure Functions - Flex Consumption</text>
  <text x="1275" y="483" text-anchor="middle" class="box-copy">Comms, reminders, expiry, webhooks and integrations</text>
  <rect x="1055" y="526" width="210" height="82" class="box fn-box"/>
  <text x="1160" y="551" text-anchor="middle" class="box-title">Durable Functions</text>
  <text x="1160" y="571" text-anchor="middle" class="box-copy">Renewals, refunds</text>
  <text x="1160" y="588" text-anchor="middle" class="box-copy">and workflows</text>
  <rect x="1285" y="526" width="210" height="82" class="box fn-box"/>
  <text x="1390" y="551" text-anchor="middle" class="box-title">Container Apps Jobs</text>
  <text x="1390" y="571" text-anchor="middle" class="box-copy">Scoring, forecasting</text>
  <text x="1390" y="588" text-anchor="middle" class="box-copy">and batch analytics</text>

  <!-- Messaging -->
  <rect x="70" y="690" width="1460" height="118" class="zone"/>
  <text x="92" y="718" class="zone-title">Asynchronous backbone</text>
  <rect x="270" y="736" width="1060" height="52" class="box msg-box"/>
  <text x="800" y="758" text-anchor="middle" class="box-title">Azure Service Bus</text>
  <text x="800" y="777" text-anchor="middle" class="box-copy">Domain event topics, command queues, scheduled messages, retries, duplicate detection and dead-letter queues</text>

  <!-- Data and external -->
  <rect x="70" y="842" width="970" height="170" class="zone"/>
  <text x="92" y="870" class="zone-title">Managed data services</text>
  <rect x="105" y="895" width="410" height="82" class="box data-box"/>
  <text x="310" y="920" text-anchor="middle" class="box-title">Azure Database for PostgreSQL Flexible Server</text>
  <text x="310" y="940" text-anchor="middle" class="box-copy">Private endpoint, zone HA, PgBouncer and read replica</text>
  <text x="310" y="958" text-anchor="middle" class="box-copy">Per-service users and tenant RLS</text>
  <rect x="545" y="895" width="220" height="82" class="box data-box"/>
  <text x="655" y="920" text-anchor="middle" class="box-title">Azure Managed Redis</text>
  <text x="655" y="940" text-anchor="middle" class="box-copy">Availability, rules</text>
  <text x="655" y="958" text-anchor="middle" class="box-copy">and entitlement caches</text>
  <rect x="795" y="895" width="210" height="82" class="box data-box"/>
  <text x="900" y="920" text-anchor="middle" class="box-title">Blob Storage</text>
  <text x="900" y="940" text-anchor="middle" class="box-copy">Media, exports and</text>
  <text x="900" y="958" text-anchor="middle" class="box-copy">integration payloads</text>

  <rect x="1070" y="842" width="460" height="170" class="zone"/>
  <text x="1092" y="870" class="zone-title">External providers</text>
  <rect x="1105" y="895" width="390" height="82" class="box edge-box"/>
  <text x="1300" y="920" text-anchor="middle" class="box-title">Payments, messaging and accounting</text>
  <text x="1300" y="940" text-anchor="middle" class="box-copy">Stripe, GoCardless, email, SMS</text>
  <text x="1300" y="958" text-anchor="middle" class="box-copy">Xero, QuickBooks and partner webhooks</text>

  <!-- Operations -->
  <rect x="70" y="1040" width="1460" height="58" class="zone"/>
  <text x="92" y="1074" class="zone-title">Cross-cutting:</text>
  <text x="245" y="1074" class="box-copy">Managed Identities + RBAC</text>
  <text x="445" y="1074" class="box-copy">Key Vault</text>
  <text x="560" y="1074" class="box-copy">Azure Monitor + Application Insights + OpenTelemetry</text>
  <text x="970" y="1074" class="box-copy">Container Registry</text>
  <text x="1130" y="1074" class="box-copy">GitHub Actions / Azure DevOps</text>

  <!-- Primary flow arrows -->
  <path d="M400 182 V225" class="line"/>
  <path d="M800 182 V225" class="line"/>
  <path d="M1200 182 V225" class="line"/>
  <path d="M530 301 H625" class="line"/>
  <path d="M975 301 H1070" class="line"/>
  <path d="M1245 331 V365 H530 V438" class="line"/>
  <path d="M1245 331 V365 H825 V438" class="line"/>

  <!-- Event flow -->
  <path d="M530 526 V555" class="event"/>
  <path d="M530 621 V736" class="event"/>
  <path d="M1000 762 H1028 V473 H1055" class="event"/>
  <path d="M1000 762 H1038 V567 H1055" class="event"/>
  <path d="M1330 736 V608" class="event"/>

  <!-- Data and integrations -->
  <path d="M310 895 V835 H235 V526" class="line"/>
  <path d="M655 895 V825 H530 V526" class="line"/>
  <path d="M1275 508 V825 H900 V895" class="line"/>
  <path d="M1275 508 V835 H515 V895" class="line"/>
  <path d="M1495 473 H1538 V936 H1495" class="line"/>

  <text x="835" y="678" class="small">events and commands</text>
  <text x="1015" y="746" class="small">trigger</text>
</svg>
